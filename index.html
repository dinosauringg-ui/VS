<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<title>Vltimate Showdown</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}

/* ══ THEME TOKENS ══ */
:root{
  --red:#ff2d55;--red-d:rgba(255,45,85,.18);--red-g:rgba(255,45,85,.35);
  --blue:#0a84ff;--blue-d:rgba(10,132,255,.18);--blue-g:rgba(10,132,255,.35);
  --gold:#ffd60a;--gold-d:rgba(255,214,10,.13);
  --bg:#07070f;--surf:#0d0d1c;--surf2:#13132a;
  --border:rgba(255,255,255,.07);--border2:rgba(255,255,255,.14);
  --text:#edeeff;--muted:rgba(237,238,255,.45);
  --bg-grad:radial-gradient(ellipse 80% 50% at 15% -5%,rgba(255,45,85,.07) 0%,transparent 55%),
    radial-gradient(ellipse 80% 50% at 85% 105%,rgba(10,132,255,.07) 0%,transparent 55%),var(--bg);
  --D:'Bebas Neue',cursive;--B:'Inter',sans-serif;
}
[data-theme="arcade"]{
  --red:#ff006e;--red-d:rgba(255,0,110,.2);--red-g:rgba(255,0,110,.4);
  --blue:#00f5ff;--blue-d:rgba(0,245,255,.15);--blue-g:rgba(0,245,255,.35);
  --gold:#fcff4b;--gold-d:rgba(252,255,75,.12);
  --bg:#050510;--surf:#0a0a20;--surf2:#10102e;
  --border:rgba(0,245,255,.1);--border2:rgba(0,245,255,.22);
  --text:#e8ffff;--muted:rgba(200,255,255,.4);
  --bg-grad:radial-gradient(ellipse 70% 60% at 20% 10%,rgba(255,0,110,.09) 0%,transparent 60%),
    radial-gradient(ellipse 70% 60% at 80% 90%,rgba(0,245,255,.09) 0%,transparent 60%),var(--bg);
}
[data-theme="blood"]{
  --red:#ff3131;--red-d:rgba(255,49,49,.2);--red-g:rgba(255,49,49,.45);
  --blue:#c0392b;--blue-d:rgba(192,57,43,.2);--blue-g:rgba(192,57,43,.4);
  --gold:#ff6b35;--gold-d:rgba(255,107,53,.13);
  --bg:#080303;--surf:#120505;--surf2:#1a0707;
  --border:rgba(255,49,49,.1);--border2:rgba(255,49,49,.22);
  --text:#ffe8e8;--muted:rgba(255,220,220,.38);
  --bg-grad:radial-gradient(ellipse 80% 60% at 50% 50%,rgba(255,49,49,.06) 0%,transparent 65%),var(--bg);
}
[data-theme="jungle"]{
  --red:#ff4757;--red-d:rgba(255,71,87,.18);--red-g:rgba(255,71,87,.35);
  --blue:#2ed573;--blue-d:rgba(46,213,115,.15);--blue-g:rgba(46,213,115,.3);
  --gold:#ffa502;--gold-d:rgba(255,165,2,.12);
  --bg:#030d07;--surf:#071409;--surf2:#0d1e0f;
  --border:rgba(46,213,115,.09);--border2:rgba(46,213,115,.18);
  --text:#e8fff0;--muted:rgba(200,255,220,.38);
  --bg-grad:radial-gradient(ellipse 80% 60% at 50% 100%,rgba(46,213,115,.07) 0%,transparent 60%),
    radial-gradient(ellipse 60% 40% at 20% 0%,rgba(255,71,87,.05) 0%,transparent 50%),var(--bg);
}
[data-theme="retro"]{
  --red:#ff0080;--red-d:rgba(255,0,128,.25);--red-g:rgba(255,0,128,.5);
  --blue:#00ffff;--blue-d:rgba(0,255,255,.2);--blue-g:rgba(0,255,255,.4);
  --gold:#ffff00;--gold-d:rgba(255,255,0,.15);
  --bg:#0a0a0a;--surf:#1a1a1a;--surf2:#2a2a2a;
  --border:rgba(0,255,255,.15);--border2:rgba(0,255,255,.3);
  --text:#ffffff;--muted:rgba(255,255,255,.5);
  --bg-grad:linear-gradient(45deg, #0a0a0a 0%, #1a1a1a 50%, #0a0a0a 100%),
    radial-gradient(circle at 20% 80%, rgba(255,0,128,.1) 0%, transparent 50%),
    radial-gradient(circle at 80% 20%, rgba(0,255,255,.1) 0%, transparent 50%);
}
[data-theme="candy"]{
  --red:#ff6b9d;--red-d:rgba(255,107,157,.2);--red-g:rgba(255,107,157,.4);
  --blue:#6b9dff;--blue-d:rgba(107,157,255,.2);--blue-g:rgba(107,157,255,.4);
  --gold:#ffd93d;--gold-d:rgba(255,217,61,.15);
  --bg:#fff8f0;--surf:#ffe8d6;--surf2:#ffd1b3;
  --border:rgba(255,107,157,.2);--border2:rgba(255,107,157,.4);
  --text:#2d1b69;--muted:rgba(45,27,105,.6);
  --bg-grad:radial-gradient(ellipse 80% 60% at 50% 50%,rgba(255,217,61,.1) 0%,transparent 70%),
    linear-gradient(135deg, #fff8f0 0%, #ffe8d6 100%);
}
[data-theme="mono"]{
  --red:#ffffff;--red-d:rgba(255,255,255,.15);--red-g:rgba(255,255,255,.3);
  --blue:#cccccc;--blue-d:rgba(204,204,204,.15);--blue-g:rgba(204,204,204,.3);
  --gold:#888888;--gold-d:rgba(136,136,136,.12);
  --bg:#000000;--surf:#111111;--surf2:#222222;
  --border:rgba(255,255,255,.1);--border2:rgba(255,255,255,.2);
  --text:#ffffff;--muted:rgba(255,255,255,.5);
  --bg-grad:linear-gradient(135deg, #000000 0%, #111111 50%, #000000 100%);
}
[data-theme="cyber"]{
  --red:#ff4500;--red-d:rgba(255,69,0,.25);--red-g:rgba(255,69,0,.5);
  --blue:#0080ff;--blue-d:rgba(0,128,255,.25);--blue-g:rgba(0,128,255,.5);
  --gold:#ffff00;--gold-d:rgba(255,255,0,.2);
  --bg:#0a0a0a;--surf:#151520;--surf2:#1f1f3e;
  --border:rgba(255,255,0,.2);--border2:rgba(255,255,0,.4);
  --text:#00ff00;--muted:rgba(0,255,0,.6);
  --D:'Courier New',monospace;--B:'Courier New',monospace;
  --bg-grad:linear-gradient(135deg, #0a0a0a 0%, #151520 50%, #0a0a0a 100%);
}

html,body{background:var(--bg);color:var(--text);font-family:var(--B);min-height:100vh;overflow-x:hidden;-webkit-font-smoothing:antialiased;transition:background .4s,color .3s;}

/* ══ RETRO CRT EFFECTS ══ */
[data-theme="cyber"] body {
  text-shadow: 0 0 8px rgba(0, 255, 0, 0.2);
}

[data-theme="cyber"] html, [data-theme="retro"] body {
  background-image: 
    repeating-linear-gradient(0deg, rgba(0, 255, 0, 0.03) 0px, rgba(0, 255, 0, 0.03) 1px, transparent 1px, transparent 2px);
}

[data-theme="cyber"] {
  color-scheme: dark;
}

[data-theme="cyber"] body {
  text-shadow: 0 0 8px rgba(0, 255, 0, 0.25);
}

[data-theme="cyber"] html, [data-theme="retro"] body {
  background-image: 
    repeating-linear-gradient(0deg, rgba(0, 255, 0, 0.04) 0px, rgba(0, 255, 0, 0.04) 1px, transparent 1px, transparent 2px);
}

[data-theme="cyber"] #root {
  border-radius: 60px;
  box-shadow: 
    inset 0 0 80px rgba(0, 255, 0, 0.12),
    0 0 60px rgba(255, 69, 0, 0.25);
}

[data-theme="cyber"] .shell {
  border-radius: 40px;
  border: 12px solid #0a0a0a;
  box-shadow: 
    inset 0 0 60px rgba(0, 0, 0, 0.9),
    0 0 50px rgba(255, 69, 0, 0.35);
}

[data-theme="cyber"] .btn {
  background: linear-gradient(145deg, #00ff00 0%, #00cc00 100%) !important;
  color: #000 !important;
  box-shadow: 0 0 20px rgba(0, 255, 0, 0.4), inset 0 -2px 0 rgba(0, 0, 0, 0.3) !important;
  text-shadow: none !important;
}

[data-theme="cyber"] .btn:hover {
  box-shadow: 0 0 30px rgba(0, 255, 0, 0.6), inset 0 -2px 0 rgba(0, 0, 0, 0.3) !important;
}

[data-theme="cyber"] .btn-r {
  background: linear-gradient(145deg, #ff4500 0%, #cc3500 100%) !important;
  color: #0a0a0a !important;
  box-shadow: 0 0 20px rgba(255, 69, 0, 0.5), inset 0 -2px 0 rgba(0, 0, 0, 0.4) !important;
}

[data-theme="cyber"] .btn-b {
  background: linear-gradient(145deg, #0080ff 0%, #0060cc 100%) !important;
  color: #fff !important;
  box-shadow: 0 0 20px rgba(0, 128, 255, 0.5), inset 0 -2px 0 rgba(0, 0, 0, 0.4) !important;
}

[data-theme="cyber"] .btn-g {
  background: linear-gradient(145deg, #ffff00 0%, #ffcc00 100%) !important;
  color: #000 !important;
  box-shadow: 0 0 20px rgba(255, 255, 0, 0.5), inset 0 -2px 0 rgba(0, 0, 0, 0.4) !important;
}

[data-theme="cyber"] .f-card {
  border-radius: 8px;
  border: 2px solid rgba(0, 255, 0, 0.3) !important;
  box-shadow: 
    0 0 30px rgba(0, 255, 0, 0.2),
    inset 0 0 15px rgba(0, 255, 0, 0.05);
}

[data-theme="cyber"] .score-bar {
  background: rgba(0, 0, 0, 0.6) !important;
  border: 2px solid rgba(0, 255, 0, 0.3) !important;
  border-bottom: 3px solid rgba(0, 255, 0, 0.5) !important;
}

[data-theme="cyber"] .inp {
  background: #0a0a0a !important;
  border: 2px solid rgba(0, 255, 0, 0.3) !important;
  color: #00ff00 !important;
  font-family: 'Courier New', monospace !important;
}

[data-theme="cyber"] .inp:focus {
  border-color: rgba(0, 255, 0, 0.6) !important;
  box-shadow: 0 0 15px rgba(0, 255, 0, 0.3) !important;
}

[data-theme="cyber"] .chip {
  background: rgba(0, 0, 0, 0.5) !important;
  border: 1px solid rgba(0, 255, 0, 0.4) !important;
  color: rgba(0, 255, 0, 0.8) !important;
}

[data-theme="cyber"] .chip:hover, [data-theme="retro"] .chip.on {
  background: rgba(0, 255, 0, 0.2) !important;
  border-color: rgba(0, 255, 0, 0.7) !important;
  color: #00ff00 !important;
}

[data-theme="cyber"] .scen-banner {
  background: rgba(0, 0, 0, 0.5) !important;
  border: 2px solid rgba(0, 255, 0, 0.3) !important;
}

[data-theme="cyber"] .theme-swatch {
  background: rgba(0, 0, 0, 0.6) !important;
  border: 2px solid rgba(0, 255, 0, 0.2) !important;
}

[data-theme="cyber"] .theme-swatch:hover {
  border-color: rgba(0, 255, 0, 0.5) !important;
}

[data-theme="cyber"] .pack-card {
  background: rgba(0, 0, 0, 0.6) !important;
  border: 2px solid rgba(0, 255, 0, 0.2) !important;
}


/* ════════════════════════════════════════════════
   RETRO: FULL ARCADE OVERHAUL
   ════════════════════════════════════════════════ */

/* Stronger CRT scanlines — actually visible */
[data-theme="cyber"] html,[data-theme="cyber"] body{
  background-image:
    repeating-linear-gradient(0deg,
      rgba(0,0,0,0.22) 0px, rgba(0,0,0,0.22) 1px,
      transparent 1px, transparent 3px
    ),
    repeating-linear-gradient(0deg,
      rgba(0,255,0,0.05) 0px, rgba(0,255,0,0.05) 1px,
      transparent 1px, transparent 2px
    ) !important;
}

/* Nuke the existing pill-shaped root */
[data-theme="cyber"] #root{border-radius:0!important;}

/* Shell = arcade cabinet bezel: square, glowing green border */
[data-theme="cyber"] .shell{
  border-radius:0!important;
  border:3px solid #00ff00!important;
  box-shadow:
    0 0 0 6px #000,
    0 0 0 9px #00ff00,
    0 0 80px rgba(0,255,0,0.45),
    inset 0 0 60px rgba(0,0,0,0.7)!important;
}

/* Everything square — pixelated feel */
[data-theme="cyber"] .btn,
[data-theme="cyber"] .btn-ghost,
[data-theme="cyber"] .btn-sm,
[data-theme="cyber"] .btn-outline-r,
[data-theme="cyber"] .btn-outline-b{border-radius:0!important;}

[data-theme="cyber"] .f-card,
[data-theme="cyber"] .draft-card,
[data-theme="cyber"] .f-list-item,
[data-theme="cyber"] .pos-row,
[data-theme="cyber"] .pos-lbl,
[data-theme="cyber"] .pack-card,
[data-theme="cyber"] .confirm-modal,
[data-theme="cyber"] .cat-header,
[data-theme="cyber"] .dir-chip,
[data-theme="cyber"] .mode-mini,
[data-theme="cyber"] .mode-hero,
[data-theme="cyber"] .mode-mini-icon,
[data-theme="cyber"] .mode-icon,
[data-theme="cyber"] .settings-tab,
[data-theme="cyber"] .theme-swatch,
[data-theme="cyber"] .score-bar,
[data-theme="cyber"] .rr-card,
[data-theme="cyber"] .rr-chip,
[data-theme="cyber"] .lineup-item,
[data-theme="cyber"] .inp,
[data-theme="cyber"] .active-pack-pill,
[data-theme="cyber"] .winner-announcement,
[data-theme="cyber"] .results-score-strip,
[data-theme="cyber"] .confirm-buttons button{border-radius:0!important;}

/* Green glow on fighter cards */
[data-theme="cyber"] .f-card{
  border-width:2px!important;
  box-shadow:4px 4px 0 rgba(0,255,0,0.15),0 0 20px rgba(0,255,0,0.1)!important;
}

/* Score bar = arcade HUD display */
[data-theme="cyber"] .score-bar{
  background:#000!important;
  border:2px solid #00ff00!important;
  letter-spacing:1px!important;
}

/* Pixel-offset shadow on buttons */
[data-theme="cyber"] .btn{
  letter-spacing:3px!important;
  box-shadow:4px 4px 0 rgba(0,0,0,0.8),0 0 20px rgba(0,255,0,0.3)!important;
}
[data-theme="cyber"] .btn-r{box-shadow:4px 4px 0 rgba(0,0,0,0.8),0 0 16px rgba(255,69,0,0.4)!important;}
[data-theme="cyber"] .btn-b{box-shadow:4px 4px 0 rgba(0,0,0,0.8),0 0 16px rgba(0,128,255,0.4)!important;}

/* Nav back = terminal prompt */
[data-theme="cyber"] .nav-back::before{content:'> ';color:#00ff00;}
[data-theme="cyber"] .nav-back{letter-spacing:2px!important;}

/* Win text: pixel offset + phosphor glow */
[data-theme="cyber"] .win-big{
  letter-spacing:6px!important;
  text-shadow:4px 4px 0 rgba(0,0,0,0.8),0 0 60px rgba(0,255,0,0.9)!important;
  font-size:clamp(44px,11vw,60px)!important;
}

/* Font sizes scaled for monospace width */
[data-theme="cyber"] .results-winner{font-size:26px!important;}
[data-theme="cyber"] .results-big-score{font-size:38px!important;}
[data-theme="cyber"] .turn-banner{font-size:17px!important;}
[data-theme="cyber"] .scen-in{font-size:clamp(14px,3.8vw,20px)!important;}
[data-theme="cyber"] .f-name{font-size:clamp(13px,3.5vw,17px)!important;}
[data-theme="cyber"] .mode-title{font-size:14px!important;}
[data-theme="cyber"] .section-lbl{font-size:11px!important;}
[data-theme="cyber"] .cat-title{font-size:15px!important;}
[data-theme="cyber"] .pos-lbl{font-size:17px!important;}
[data-theme="cyber"] .lineup-hd{font-size:14px!important;}

/* ════════════════════════════════════════════════
   COLOSSEUM: FULL ROMAN OVERHAUL
   ════════════════════════════════════════════════ */

/* Shell = stone column frame — prominent top & bottom cornicing */
[data-theme="colosseum"] .shell{
  border-top:6px solid #8B6914!important;
  border-bottom:6px solid #8B6914!important;
  background-image:
    repeating-linear-gradient(90deg,
      rgba(218,165,32,0.04) 0px, rgba(218,165,32,0.04) 1px,
      transparent 1px, transparent 70px
    ),
    repeating-linear-gradient(0deg,
      rgba(218,165,32,0.025) 0px, rgba(218,165,32,0.025) 1px,
      transparent 1px, transparent 70px
    )!important;
}

/* Reduce border-radius across the board — architecture, not bubblegum */
[data-theme="colosseum"] .btn,
[data-theme="colosseum"] .btn-ghost,
[data-theme="colosseum"] .btn-sm,
[data-theme="colosseum"] .btn-outline-r,
[data-theme="colosseum"] .btn-outline-b,
[data-theme="colosseum"] .confirm-buttons button{border-radius:6px!important;}

[data-theme="colosseum"] .f-card,
[data-theme="colosseum"] .score-bar,
[data-theme="colosseum"] .results-score-strip,
[data-theme="colosseum"] .winner-announcement{border-radius:8px!important;}

[data-theme="colosseum"] .draft-card,
[data-theme="colosseum"] .f-list-item,
[data-theme="colosseum"] .pos-row,
[data-theme="colosseum"] .pack-card,
[data-theme="colosseum"] .confirm-modal,
[data-theme="colosseum"] .cat-header,
[data-theme="colosseum"] .inp,
[data-theme="colosseum"] .mode-mini,
[data-theme="colosseum"] .mode-hero,
[data-theme="colosseum"] .mode-mini-icon,
[data-theme="colosseum"] .mode-icon,
[data-theme="colosseum"] .settings-tab,
[data-theme="colosseum"] .rr-card,
[data-theme="colosseum"] .rr-chip,

[data-theme="colosseum"] .chip,
[data-theme="colosseum"] .dir-chip,
[data-theme="colosseum"] .active-pack-pill{border-radius:4px!important;}

/* Fighter cards: thicker left border, drop shadow like carved stone */
[data-theme="colosseum"] .f-card.r{
  border-left:5px solid #d62828!important;
  box-shadow:6px 6px 0 rgba(0,0,0,0.5),0 0 30px rgba(214,40,40,0.15)!important;
}
[data-theme="colosseum"] .f-card.b{
  border-left:5px solid #b8860b!important;
  box-shadow:6px 6px 0 rgba(0,0,0,0.5),0 0 30px rgba(184,134,11,0.15)!important;
}

/* Score bar = stone tablet */
[data-theme="colosseum"] .score-bar{
  border:2px solid rgba(218,165,32,0.5)!important;
  border-top:3px solid rgba(218,165,32,0.7)!important;
  border-bottom:3px solid rgba(218,165,32,0.7)!important;
  background:linear-gradient(135deg,rgba(0,0,0,0.7),rgba(218,165,32,0.08))!important;
}

/* Mode cards: stone tile feel */
[data-theme="colosseum"] .mode-mini{
  border:1.5px solid rgba(218,165,32,0.4)!important;
  background:linear-gradient(135deg,rgba(218,165,32,0.07) 0%,rgba(0,0,0,0.45) 100%)!important;
  box-shadow:3px 3px 0 rgba(0,0,0,0.4)!important;
}
[data-theme="colosseum"] .mode-hero{
  box-shadow:4px 4px 0 rgba(0,0,0,0.45)!important;
}

/* Nav back styled as Roman decree */
[data-theme="colosseum"] .nav-back{
  letter-spacing:3px!important;
  font-variant:small-caps!important;
  color:#daa520!important;
}

/* Win text: stone-engraved feel */
[data-theme="colosseum"] .win-big{
  letter-spacing:6px!important;
  text-shadow:4px 4px 0 rgba(0,0,0,0.6),0 0 60px rgba(218,165,32,0.5)!important;
  font-size:clamp(44px,11vw,60px)!important;
}

/* Font sizes scaled for Georgia serif width */
[data-theme="colosseum"] .results-winner{font-size:26px!important;}

#root{display:flex;justify-content:center;min-height:100vh;background:var(--bg-grad);transition:background .4s;}
.shell{width:100%;max-width:430px;min-height:100vh;display:flex;flex-direction:column;position:relative;overflow:hidden;padding-bottom:max(20px,env(safe-area-inset-bottom));}

@keyframes fadeUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
@keyframes pop{0%{opacity:0;transform:scale(.8) rotate(-4deg)}65%{transform:scale(1.06) rotate(1deg)}100%{opacity:1;transform:scale(1) rotate(0)}}
@keyframes winPop{0%{opacity:0;transform:scale(.5) rotate(-10deg)}65%{transform:scale(1.12)}100%{opacity:1;transform:scale(1)}}
@keyframes pulseR{0%,100%{box-shadow:0 0 22px var(--red-d)}50%{box-shadow:0 0 44px var(--red-g)}}
@keyframes pulseB{0%,100%{box-shadow:0 0 22px var(--blue-d)}50%{box-shadow:0 0 44px var(--blue-g)}}
@keyframes slamIn{0%{transform:scale(1.3) translateY(-30px);opacity:0}100%{transform:scale(1) translateY(0);opacity:1}}
@keyframes floatIdle{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes timerExpired{0%{transform:scale(1);opacity:1}50%{transform:scale(1.1);opacity:0.8}100%{transform:scale(1);opacity:1}}

.a0{animation:fadeUp .35s ease both}
.a1{animation:fadeUp .35s .07s ease both}
.a2{animation:fadeUp .35s .14s ease both}
.a3{animation:fadeUp .35s .21s ease both}
.a4{animation:fadeUp .35s .28s ease both}
.apop{animation:pop .4s ease both}
.aslam{animation:slamIn .5s cubic-bezier(.175,.885,.32,1.275) both}

.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:12px 18px;border:none;border-radius:16px;font-family:var(--D);font-size:16px;letter-spacing:1px;cursor:pointer;transition:transform .2s,box-shadow .2s,filter .2s;background-position:100% 0;-webkit-tap-highlight-color:transparent;user-select:none;}
.btn:hover{transform:translateY(-1px);}
.btn:focus-visible{outline:2px solid var(--gold);outline-offset:3px;}
.btn:active{transform:scale(.98);filter:brightness(.92);}
.btn-r{background:var(--red);color:#fff;box-shadow:0 14px 30px rgba(255,45,85,.18);}
.btn-b{background:var(--blue);color:#fff;box-shadow:0 4px 24px var(--blue-g);}
.btn-g{background:var(--gold);color:#000;box-shadow:0 4px 20px var(--gold-d);}
.btn-ghost{background:transparent;color:var(--muted);border:1.5px solid var(--border);font-family:var(--B);font-size:14px;font-weight:800;letter-spacing:.3px;padding:12px 20px;border-radius:12px;transition:all .15s;}
.btn-ghost:hover{color:var(--text);border-color:var(--border2);}
.btn-sm{padding:11px 16px;font-size:17px;border-radius:11px;}
.btn-outline-r{background:var(--red-d);color:var(--red);border:1.5px solid rgba(255,45,85,.3);font-family:var(--D);font-size:18px;letter-spacing:1px;padding:14px;border-radius:14px;cursor:pointer;flex:1;-webkit-tap-highlight-color:transparent;transition:all .15s;}
.btn-outline-r:active{transform:scale(.96);}
.btn-outline-b{background:var(--blue-d);color:var(--blue);border:1.5px solid rgba(10,132,255,.3);font-family:var(--D);font-size:18px;letter-spacing:1px;padding:14px;border-radius:14px;cursor:pointer;flex:1;-webkit-tap-highlight-color:transparent;transition:all .15s;}
.btn-outline-b:active{transform:scale(.96);}

.inp{background:var(--surf2);border:1.5px solid var(--border);border-radius:12px;padding:13px 16px;color:var(--text);font-family:var(--B);font-size:16px;font-weight:700;width:100%;outline:none;transition:border-color .2s;}
.inp:focus{border-color:var(--border2);}
.inp::placeholder{color:var(--muted);font-weight:400;}

.chip{display:inline-flex;align-items:center;gap:5px;padding:7px 15px;border-radius:999px;border:1.5px solid var(--border);background:var(--surf);color:var(--muted);font-size:13px;font-weight:800;cursor:pointer;transition:all .15s;-webkit-tap-highlight-color:transparent;}
.chip:hover,.chip.on{color:var(--gold);border-color:rgba(255,214,10,.4);background:var(--gold-d);}

.tog{position:relative;width:46px;height:26px;flex-shrink:0;}
.tog input{position:absolute;opacity:0;width:0;height:0;}
.tog-tr{position:absolute;inset:0;border-radius:999px;background:var(--surf2);border:1.5px solid var(--border);cursor:pointer;transition:.2s;}
.tog-tr::after{content:'';position:absolute;left:3px;top:50%;transform:translateY(-50%);width:18px;height:18px;border-radius:50%;background:var(--muted);transition:.2s;}
.tog input:checked~.tog-tr{background:var(--gold);border-color:var(--gold);}
.tog input:checked~.tog-tr::after{left:calc(100% - 21px);background:#000;}

.score-bar{display:flex;align-items:center;justify-content:space-between;padding:10px 20px;background:var(--surf);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:10;backdrop-filter:blur(12px);}
.score-side{display:flex;flex-direction:column;align-items:center;gap:1px;min-width:90px;}
.score-n{font-family:var(--D);font-size:32px;line-height:1;}
.score-n.r{color:var(--red);}
.score-n.b{color:var(--blue);}
.score-lbl{font-size:10px;font-weight:800;letter-spacing:1.5px;color:var(--muted);text-transform:uppercase;max-width:90px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.score-mid{display:flex;flex-direction:column;align-items:center;}
.score-vs{font-family:var(--D);font-size:13px;letter-spacing:3px;color:var(--border2);}
.reset-btn{background:none;border:none;color:var(--muted);font-size:10px;font-weight:800;letter-spacing:.5px;cursor:pointer;padding:2px 6px;border-radius:4px;margin-top:2px;}
.reset-btn:hover{color:var(--text);}

.scen-banner{text-align:center;padding:18px 20px 10px;}
.scen-who{font-family:var(--D);font-size:14px;letter-spacing:4px;color:var(--muted);display:block;}
.scen-in{font-family:var(--D);font-size:clamp(18px,5vw,26px);color:var(--gold);letter-spacing:1px;line-height:1.15;text-shadow:0 0 40px var(--gold-d);display:block;}

.f-row{display:flex;gap:8px;padding:0 16px;}
.f-wrap{flex:1;display:flex;flex-direction:column;justify-content:stretch;}
.f-wrap.r,.f-wrap.b{animation:none;}
.f-card{
  flex:1;border-radius:20px;padding:14px 14px 14px 16px;
  display:flex;flex-direction:column;align-items:flex-start;text-align:left;
  min-height:200px;justify-content:space-between;
  position:relative;overflow:hidden;
}
/* Diagonal fine-line texture */
.f-card::before{
  content:'';position:absolute;inset:0;
  background:repeating-linear-gradient(-50deg,transparent,transparent 18px,rgba(255,255,255,.018) 18px,rgba(255,255,255,.018) 19px);
  pointer-events:none;z-index:0;
}
/* Large ambient orb top-right */
.f-card::after{
  content:'';position:absolute;top:-50px;right:-50px;
  width:150px;height:150px;border-radius:50%;
  pointer-events:none;z-index:0;
}
.f-card>*{position:relative;z-index:1;}

/* Watermark initial – rendered via JS span */
.f-watermark{
  position:absolute;bottom:-10px;right:-4px;
  font-family:var(--D);font-size:120px;line-height:1;letter-spacing:-4px;
  font-weight:900;pointer-events:none;z-index:0;
  opacity:.055;user-select:none;
}

.f-card.r{
  background:linear-gradient(145deg,rgba(255,45,85,.2) 0%,var(--surf) 45%,var(--surf2) 100%);
  border:1px solid rgba(255,45,85,.38);
  border-left:3px solid var(--red);
  box-shadow:0 12px 40px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.07);
  animation:pulseR 3.5s ease-in-out infinite;
}
.f-card.r::after{background:radial-gradient(circle,rgba(255,45,85,.35) 0%,transparent 70%);}
.f-watermark.r{color:var(--red);}

.f-card.b{
  background:linear-gradient(145deg,rgba(10,132,255,.2) 0%,var(--surf) 45%,var(--surf2) 100%);
  border:1px solid rgba(10,132,255,.38);
  border-left:3px solid var(--blue);
  box-shadow:0 12px 40px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.07);
  animation:pulseB 3.5s ease-in-out infinite;
}
.f-card.b::after{background:radial-gradient(circle,rgba(10,132,255,.35) 0%,transparent 70%);}
.f-watermark.b{color:var(--blue);}

.f-team{
  font-family:var(--D);font-size:9px;letter-spacing:2.5px;
  padding:3px 8px;border-radius:4px;display:inline-block;
}
.f-team.r{color:var(--red);background:rgba(255,45,85,.15);border:1px solid rgba(255,45,85,.3);}
.f-team.b{color:var(--blue);background:rgba(10,132,255,.15);border:1px solid rgba(10,132,255,.3);}

.f-content{display:flex;flex-direction:column;width:100%;position:relative;z-index:1;}
.f-name{font-family:var(--D);font-size:clamp(16px,4.5vw,20px);line-height:1;color:var(--text);letter-spacing:.3px;}
.f-name-sm{font-size:clamp(12px,3.5vw,16px)!important;}
.f-pair-sep{font-size:9px;color:var(--muted);font-weight:900;letter-spacing:2.5px;margin:5px 0;}

/* Tag as a compact footer */
.f-tag{
  font-size:10px;color:var(--muted);font-style:italic;line-height:1.45;
  margin-top:8px;padding-top:7px;width:100%;
  border-top:1px solid rgba(255,255,255,.07);
}
.f-tag::before{content:'" ';opacity:.5;}

/* Fighter emoji and description tooltip */
.f-emoji{
  font-size:28px;
  text-shadow:0 0 12px currentColor;
}
/* ══ IMPROVED TOOLTIP (Inward-Anchored) ══ */
.f-wrap {
  position: relative; /* Anchor for the tooltip */
}

.tooltip-text {
  visibility: hidden;
  background-color: var(--surf2);
  border: 1px solid var(--border2);
  color: var(--text);
  text-align: center;
  border-radius: 12px;
  padding: 10px 16px;
  position: absolute;
  bottom: 100%; 
  z-index: 9999;
  opacity: 0;
  transition: opacity .2s, transform .2s;
  pointer-events: none;
  font-size: 12px;
  line-height: 1.4;
  box-shadow: 0 12px 36px rgba(0,0,0,.4);
  margin-bottom: 12px;
  
  /* Sizing constraints for mobile */
  width: max-content;
  max-width: 220px; 
}

/* Red Team (Left Card) - Anchor left, expand right */
.f-wrap.r .tooltip-text {
  left: 0;
  transform: translateY(10px); 
}
.f-wrap.r:hover .tooltip-text {
  visibility: visible;
  opacity: 1;
  transform: translateY(0);
}

/* Blue Team (Right Card) - Anchor right, expand left */
.f-wrap.b .tooltip-text {
  right: 0;
  transform: translateY(10px); 
}
.f-wrap.b:hover .tooltip-text {
  visibility: visible;
  opacity: 1;
  transform: translateY(0);
}




/* VS separator — vertical line with centered label */
.vs-pill{
  display:flex;flex-direction:column;align-items:center;
  width:22px;flex-shrink:0;align-self:stretch;
  animation:pop .4s .3s ease both;gap:0;
}
.vs-pill::before,.vs-pill::after{content:'';flex:1;width:1px;min-height:10px;}
.vs-pill::before{background:linear-gradient(to bottom,transparent,var(--border2));}
.vs-pill::after{background:linear-gradient(to top,transparent,var(--border2));}
.vs-pill span{font-family:var(--D);font-size:9px;letter-spacing:2px;color:var(--muted);writing-mode:vertical-rl;padding:6px 0;}
.vote-row{display:flex;gap:10px;padding:0 16px;}
.win-overlay{position:fixed;inset:0;z-index:200;display:flex;flex-direction:column;align-items:center;justify-content:center;backdrop-filter:blur(14px);}
.win-overlay.r{background:rgba(255,45,85,.28);}
.win-overlay.b{background:rgba(10,132,255,.28);}
.win-big{font-family:var(--D);font-size:clamp(68px,18vw,90px);letter-spacing:3px;line-height:.95;animation:winPop .5s ease both;}
.win-big.r{color:var(--red);text-shadow:0 0 60px var(--red-g);}
.win-big.b{color:var(--blue);text-shadow:0 0 60px var(--blue-g);}
.win-sub{font-size:18px;font-weight:800;color:rgba(255,255,255,.7);margin-top:6px;letter-spacing:.5px;}
.win-dismiss{margin-top:28px;font-size:13px;color:rgba(255,255,255,.5);font-weight:700;letter-spacing:.5px;cursor:pointer;}

.home-sub{font-family:var(--D);font-size:13px;letter-spacing:6px;color:var(--muted);text-align:center;}
.nav-back{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:800;color:var(--muted);background:none;border:none;cursor:pointer;padding:16px 20px;-webkit-tap-highlight-color:transparent;}
.nav-back:hover{color:var(--text);}
.section-lbl{font-family:var(--D);font-size:13px;letter-spacing:3px;color:var(--muted);}

.f-list-item{display:flex;align-items:center;gap:12px;padding:13px 16px;background:var(--surf);border:1px solid var(--border);border-radius:12px;transition:border-color .15s;}
.f-list-item:hover{border-color:var(--border2);}
.f-list-info{flex:1;min-width:0;}
.f-list-name{font-weight:900;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.f-list-tag{font-size:12px;color:var(--muted);font-style:italic;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.del-btn{background:none;border:none;color:rgba(255,45,85,.45);cursor:pointer;font-size:20px;padding:4px;flex-shrink:0;line-height:1;}
.del-btn:hover{color:var(--red);}

.draft-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:0 16px;}
.draft-card{padding:12px 14px;background:var(--surf);border:1.5px solid var(--border);border-radius:12px;cursor:pointer;transition:all .12s;-webkit-tap-highlight-color:transparent;text-align:left;}
.draft-card:hover:not(.drafted-r):not(.drafted-b){border-color:var(--border2);background:var(--surf2);}
.draft-card.drafted-r{border-color:var(--red);background:var(--red-d);opacity:.45;cursor:default;}
.draft-card.drafted-b{border-color:var(--blue);background:var(--blue-d);opacity:.45;cursor:default;}
.draft-card-name{font-weight:900;font-size:14px;line-height:1.2;}
.draft-card-tag{font-size:11px;color:var(--muted);margin-top:2px;}
.turn-banner{text-align:center;padding:10px 20px;font-family:var(--D);font-size:22px;letter-spacing:3px;}
.turn-banner.r{color:var(--red);}
.turn-banner.b{color:var(--blue);}
.pos-rows{display:flex;flex-direction:column;gap:8px;}
.pos-row{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--surf);border:1px solid var(--border);border-radius:12px;cursor:pointer;transition:all .12s;}
.pos-row:hover{border-color:var(--border2);background:var(--surf2);}
.pos-lbl{font-family:var(--D);font-size:20px;letter-spacing:2px;width:36px;flex-shrink:0;}
.pos-lbl.r{color:var(--red);}
.pos-lbl.b{color:var(--blue);}
.lineup-wrap{display:flex;gap:8px;padding:0 16px;}
.lineup-side{flex:1;}
.lineup-hd{text-align:center;font-family:var(--D);font-size:17px;letter-spacing:2px;padding:8px;border-radius:10px 10px 0 0;margin-bottom:1px;}
.lineup-hd.r{color:var(--red);background:var(--red-d);}
.lineup-hd.b{color:var(--blue);background:var(--blue-d);}
.lineup-item{padding:8px 10px;background:var(--surf);border-bottom:1px solid var(--border);}
.lineup-item:last-child{border-radius:0 0 10px 10px;border-bottom:none;}
.lineup-pos-lbl{font-family:var(--D);font-size:11px;letter-spacing:2px;color:var(--muted);}
.lineup-fname{font-weight:900;font-size:12px;line-height:1.2;margin-top:1px;}

.scroll{overflow-y:auto;-webkit-overflow-scrolling:touch;}
::-webkit-scrollbar{width:3px;}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px;}
.mode-icon{width:52px;height:52px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:26px;flex-shrink:0;}
.mode-icon.r{background:var(--red-d);}
.mode-title{font-family:var(--D);font-size:18px;letter-spacing:1px;line-height:1;}
.mode-desc{font-size:12px;color:var(--muted);margin-top:3px;line-height:1.4;}
.empty-state{display:flex;flex-direction:column;align-items:center;gap:10px;padding:32px 20px;color:var(--muted);}
.empty-icon{font-size:40px;opacity:.4;}
.empty-text{font-size:14px;font-weight:700;text-align:center;}
.cat-header{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:var(--surf2);border-radius:12px;margin-top:16px;border:1px solid var(--border);}
.cat-title{font-family:var(--D);font-size:18px;letter-spacing:.75px;text-transform:none;}
.dir-chip{display:inline-flex;font-size:12px;padding:6px 12px;border-radius:8px;border:1.5px solid var(--border);background:var(--surf);color:var(--text);font-weight:700;cursor:pointer;transition:all .12s;}
.dir-chip:hover{border-color:var(--border2);}
.dir-chip.off{opacity:0.4;text-decoration:line-through;}
.dir-chip:active{transform:scale(0.96);}
.px20{padding-left:20px;padding-right:20px;}

/* ══ THEME PICKER ══ */
.theme-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;padding:0 20px;}
.theme-swatch{border-radius:18px;padding:18px 14px;text-align:center;border:1.5px solid var(--border);cursor:pointer;transition:transform .2s,border-color .2s,background .2s;-webkit-tap-highlight-color:transparent;position:relative;background:rgba(255,255,255,.04);box-shadow:0 10px 30px rgba(0,0,0,.08);}
.theme-swatch:hover{transform:translateY(-2px);border-color:var(--border2);background:rgba(255,255,255,.08);}
.theme-swatch.active{border-color:var(--gold);background:rgba(255,214,10,.08);}
.theme-swatch.active::after{content:'✓';position:absolute;top:10px;right:12px;font-size:12px;color:var(--gold);font-weight:900;}
.theme-dots{display:flex;gap:6px;justify-content:center;margin-bottom:10px;}
.theme-dot{width:14px;height:14px;border-radius:50%;}
.theme-name{font-family:var(--D);font-size:13px;font-weight:800;letter-spacing:.08em;color:var(--text);text-transform:none;}

/* ══ EXPANSION PACKS ══ */
.pack-card{border-radius:24px;padding:24px;border:1.5px solid rgba(255,255,255,.08);background:rgba(255,255,255,.05);cursor:pointer;transition:transform .25s,border-color .25s,box-shadow .25s;background-blend-mode:screen;position:relative;overflow:hidden;box-shadow:0 14px 35px rgba(0,0,0,.12);}
.pack-card::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,214,10,.14) 0%,transparent 55%);opacity:0;transition:opacity .3s;pointer-events:none;}
.pack-card:hover{transform:translateY(-3px);border-color:var(--border2);box-shadow:0 18px 50px rgba(0,0,0,.14);}
.pack-card:active{transform:scale(.98);}
.pack-card.enabled{border-color:var(--gold);background:rgba(255,214,10,.08);}
.pack-card.enabled::before{opacity:1;}
.pack-header{display:flex;align-items:center;gap:14px;margin-bottom:12px;}
.pack-desc{margin-top:10px;color:var(--muted);line-height:1.6;}
.pack-header{display:flex;align-items:center;gap:12px;margin-bottom:10px;}
.pack-emoji{font-size:28px;flex-shrink:0;}
.pack-info{flex:1;}
.pack-name{font-family:var(--D);font-size:20px;letter-spacing:1.5px;line-height:1;}
.pack-counts{font-size:11px;color:var(--muted);font-weight:700;margin-top:2px;letter-spacing:.5px;}
.pack-desc{font-size:12px;color:var(--muted);line-height:1.5;}
.pack-badge{position:absolute;top:14px;right:14px;font-family:var(--D);font-size:11px;letter-spacing:1px;padding:3px 9px;border-radius:6px;}
.pack-badge.on{background:var(--gold);color:#000;}
.pack-badge.off{background:var(--surf2);color:var(--muted);border:1px solid var(--border);}
.active-pack-pill{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:999px;background:var(--gold-d);border:1px solid rgba(255,214,10,.3);font-size:11px;font-weight:800;color:var(--gold);}

/* ══ SETTINGS TABS ══ */
.settings-tab-bar{display:flex;gap:8px;padding:0 20px;margin-bottom:20px;}
.settings-tab{flex:1;padding:12px 10px;text-align:center;border-radius:16px;font-family:var(--D);font-size:13px;letter-spacing:1px;cursor:pointer;border:1.5px solid rgba(255,255,255,.08);background:rgba(255,255,255,.03);color:var(--muted);transition:all .2s;-webkit-tap-highlight-color:transparent;}
.settings-tab:hover{background:rgba(255,255,255,.06);}
.settings-tab.active{background:rgba(255,255,255,.08);color:var(--text);border-color:var(--border2);box-shadow:0 12px 30px rgba(0,0,0,.08);}

/* ══ CONFIRM DIALOG ══ */
.confirm-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:1000;backdrop-filter:blur(4px);}
.confirm-modal{background:var(--surf);border:1px solid var(--border);border-radius:20px;padding:24px;max-width:320px;width:90%;text-align:center;}
.confirm-message{font-size:16px;margin-bottom:20px;color:var(--text);line-height:1.4;}
.confirm-buttons{display:flex;gap:12px;justify-content:center;}
.confirm-buttons button{flex:1;padding:12px 16px;border-radius:12px;font-family:var(--D);font-size:14px;letter-spacing:1px;cursor:pointer;border:none;-webkit-tap-highlight-color:transparent;}
.confirm-buttons button:first-child{background:var(--surf2);color:var(--muted);border:1px solid var(--border);}
.confirm-buttons button:last-child{background:var(--red);color:#fff;}

/* ══ RESULTS SCREEN ══ */
.results-panel{display:flex;flex-direction:column;gap:12px;animation:fadeUp .35s ease both;}
.results-header-bar{display:flex;align-items:center;justify-content:space-between;padding:0 4px;}
.results-winner{font-family:var(--D);font-size:34px;letter-spacing:2px;line-height:1;}
.results-mode-label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:2px;margin-top:2px;}
.results-score-strip{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;background:var(--surf);border:1px solid var(--border);border-radius:18px;padding:14px 16px;}
.results-score-side{display:flex;flex-direction:column;align-items:center;gap:2px;}
.results-score-side.winner-side .results-big-score{filter:drop-shadow(0 0 12px currentColor);}
.results-big-score{font-family:var(--D);font-size:48px;line-height:1;}
.results-team-name{font-size:11px;font-weight:800;letter-spacing:1.5px;color:var(--muted);text-transform:uppercase;max-width:80px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.results-vs-dot{font-family:var(--D);font-size:13px;letter-spacing:3px;color:var(--border2);}

/* Round fight cards */
.rr-list{display:flex;flex-direction:column;gap:10px;}
.rr-card{border-radius:20px;background:var(--surf);border:1px solid var(--border);overflow:hidden;transform:translateY(20px);opacity:0;animation:slideUp .4s ease forwards;animation-delay:calc(0.05s * var(--idx));}
.rr-head{padding:10px 14px 6px;display:flex;align-items:baseline;gap:8px;}
.rr-round-label{font-family:var(--D);font-size:11px;letter-spacing:2.5px;color:var(--gold);flex-shrink:0;}
.rr-scenario{font-size:13px;color:var(--text);font-style:italic;line-height:1.3;opacity:.85;}
.rr-fighters{display:grid;grid-template-columns:1fr 28px 1fr;align-items:stretch;gap:0;padding:0 10px 10px;}
.rr-chip{border-radius:14px;padding:10px 10px;display:flex;flex-direction:column;gap:3px;transition:opacity .2s;}
.rr-chip.winner{opacity:1;}
.rr-chip.loser{opacity:.38;}
.rr-chip-team{font-size:9px;font-weight:900;letter-spacing:2px;text-transform:uppercase;margin-bottom:1px;}
.rr-chip-name{font-family:var(--D);font-size:15px;letter-spacing:.3px;line-height:1.15;color:var(--text);}
.rr-chip-crown{font-size:13px;margin-top:4px;}
.rr-sword{display:flex;align-items:center;justify-content:center;font-size:14px;opacity:.4;}
.rr-rule-tag{margin:0 10px 10px;padding:5px 10px;border-radius:8px;background:rgba(255,20,147,.09);border:1px solid rgba(255,20,147,.22);font-size:11px;color:#ff69b4;font-style:italic;display:inline-block;}
.results-empty{font-size:14px;color:var(--muted);padding:18px;border-radius:18px;background:var(--surf);border:1px solid var(--border);}
.results-actions{display:flex;gap:10px;padding:4px 0 8px;}
.results-share-feedback{font-size:12px;color:var(--muted);margin-top:4px;text-align:center;}
@keyframes slideUp{0%{opacity:0;transform:translateY(20px);}100%{opacity:1;transform:translateY(0);}}

/* ══ HOME SCREEN ══ */
.mode-hero{background:var(--surf);border:1.5px solid rgba(255,45,85,.4);background:rgba(255,45,85,.06);border-radius:18px;padding:18px 20px;display:flex;align-items:center;gap:16px;cursor:pointer;transition:all .15s;-webkit-tap-highlight-color:transparent;}
.mode-hero:hover{transform:translateY(-1px);border-color:rgba(255,45,85,.65);}
.mode-hero:active{transform:scale(.98);}
.mode-mini-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.mode-mini{background:var(--surf);border:1.5px solid var(--border);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:8px;cursor:pointer;transition:all .15s;-webkit-tap-highlight-color:transparent;}
.mode-mini:hover{border-color:var(--border2);transform:translateY(-1px);}
.mode-mini:active{transform:scale(.98);}
.mode-mini-icon{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;font-family:var(--D);letter-spacing:.5px;}
.mode-mini-title{font-family:var(--D);font-size:16px;letter-spacing:.8px;line-height:1;color:var(--text);}
.mode-mini-desc{font-size:11px;color:var(--muted);line-height:1.35;}

.tournament-bracket{display:flex;flex-direction:column;gap:20px;max-width:400px;margin:0 auto;}
.fighter-option{display:flex;flex-direction:column;align-items:center;padding:16px;border-radius:12px;cursor:pointer;transition:all .2s;min-width:140px;border:2px solid transparent;}
.fighter-option:hover{background:var(--surf2);border-color:var(--gold);transform:scale(1.02);}
.fighter-option:active{transform:scale(.98);}
.fighter-name{font-size:16px;font-weight:700;text-align:center;color:var(--text);line-height:1.2;}
.winner-badge{font-size:18px;margin-top:6px;animation:pulse 1s infinite;}
@keyframes pulse{0%,100%{transform:scale(1);}50%{transform:scale(1.1);}}
.winner-announcement{text-align:center;padding:30px;background:linear-gradient(135deg, var(--gold), var(--gold-d));border-radius:20px;margin:20px 0;color:white;animation:championGlow 2s ease-in-out;}
@keyframes championGlow{0%{box-shadow:0 0 0 0 rgba(255,214,10,0.7);}50%{box-shadow:0 0 0 10px rgba(255,214,10,0);}100%{box-shadow:0 0 0 0 rgba(255,214,10,0);}}

<script type="text/babel">
const {useState,useEffect,useRef}=React;
const FIGHTERS = window.FIGHTERS || [];
const SCENARIOS = window.SCENARIOS || [];
const EXPANSION_PACKS = window.EXPANSION_PACKS || [];
const POSITIONS=['PG','SG','SF','PF','C'];
const POS_FULL={PG:'Point Guard',SG:'Shooting Guard',SF:'Small Forward',PF:'Power Forward',C:'Center'};
 const SILLY_ADJECTIVES = [

const MASTER_DEBATE_RULES = [

const LS={
  get:(k,d)=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):d;}catch{return d;}},
  set:(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v));}catch{}}
};
const pickN=(arr,n)=>[...arr].sort(()=>Math.random()-.5).slice(0,n);
const randItem=(arr)=>arr[Math.floor(Math.random()*arr.length)];

const THEMES=[
  {id:'default',name:'MIDNIGHT',dots:['#ff2d55','#0a84ff','#ffd60a']},
  {id:'arcade', name:'ARCADE',  dots:['#ff006e','#00f5ff','#fcff4b']},
  {id:'blood',  name:'BLOOD',   dots:['#ff3131','#c0392b','#ff6b35']},
  {id:'jungle', name:'JUNGLE',  dots:['#ff4757','#2ed573','#ffa502']},
  {id:'retro',  name:'RETRO',   dots:['#ff0080','#00ffff','#ffff00']},
  {id:'candy',  name:'CANDY',   dots:['#ff6b9d','#6b9dff','#ffd93d']},
  {id:'mono',   name:'MONO',    dots:['#ffffff','#cccccc','#888888']},
  {id:'cyber',  name:'CYBER',   dots:['#00ff00','#ff4500','#0080ff']},
];

function App(){
  const [screen,setScreen]=useState('home');
  const [names,setNames]=useState(()=>LS.get('vs_names',{red:'Red Team',blue:'Blue Team'}));
  const [scores,setScores]=useState(()=>LS.get('vs_scores',{red:0,blue:0}));
  const [custom,setCustom]=useState(()=>LS.get('vs_custom',[]));
  const [fighterStats,setFighterStats]=useState(()=>LS.get('vs_fstats',{}));
  const [disabledCats,setDisabledCats]=useState(()=>LS.get('vs_cats',[]));
  const [disabledFighters,setDisabledFighters]=useState(()=>LS.get('vs_dis_f',[]));
  const [enabledPacks,setEnabledPacks]=useState(()=>LS.get('vs_packs',[]));
  const [theme,setTheme]=useState(()=>LS.get('vs_theme','default'));
  const [matchup,setMatchup]=useState(null);
  const [winTeam,setWinTeam]=useState(null);
  const [showWin,setShowWin]=useState(false);
  const [tempRed,setTempRed]=useState('');
  const [tempBlue,setTempBlue]=useState('');
    const [pendingMode,setPendingMode]=useState('classic');
  const [activeMode,setActiveMode]=useState('classic');
  const [tagline,setTagline]=useState('WHO WOULD ACTUALLY WIN?');
  const [newFName,setNewFName]=useState('');

  // Tournament state
  const [tournamentBracket,setTournamentBracket]=useState([]);
  const [tournamentRound,setTournamentRound]=useState(0);
  const [tournamentWinner,setTournamentWinner]=useState(null);
  const [tournamentSize,setTournamentSize]=useState(()=>LS.get('vs_tournament_size',8));

  // Game settings
  const [debateTimer,setDebateTimer]=useState(()=>LS.get('vs_debate_timer',0)); // 0 = disabled
  const [scoreLimit,setScoreLimit]=useState(()=>LS.get('vs_score_limit',3)); // 0 = disabled
  const [currentTimer,setCurrentTimer]=useState(0);
  const [timerActive,setTimerActive]=useState(false);
  const [timerExpired,setTimerExpired]=useState(false);
  const [gameOverTeam,setGameOverTeam]=useState(null);
  const [tooltipPosition,setTooltipPosition]=useState({x:0,y:0});
  const [roundHistory,setRoundHistory]=useState([]);

  const updateTooltipPosition = (event) => {
    setTooltipPosition({ x: event.clientX, y: event.clientY });
  };
  const [finalScores,setFinalScores]=useState({red:0,blue:0});
  const [shareResultMessage,setShareResultMessage]=useState('');
  const resultsRef=useRef(null);
  const [debateTurn,setDebateTurn]=useState('red'); // 'red' | 'blue' | 'vote'

  // The Easter Egg Roller
  useEffect(() => {
    if (screen === 'home') {
      const roll = Math.random();
      if (roll < 0.01) setTagline('OLD GODZILLA WAS HOPPING AROUND...');
      else if (roll < 0.02) setTagline('GOOD GUYS, BAD GUYS, AND EXPLOSIONS');
      else if (roll < 0.03) setTagline('OF ULTIMATE DESTINY...');
      else setTagline('WHO WOULD ACTUALLY WIN?');
    }
  }, [screen]);

  // Timer effect
  useEffect(() => {
    let interval;
    if (timerActive && currentTimer > 0) {
      interval = setInterval(() => {
        setCurrentTimer(prev => {
          if (prev <= 1) {
            setTimerActive(false);
            setTimerExpired(true);
            // Timer expired - show alert
            setTimeout(() => setTimerExpired(false), 3000);
            return 0;
          }
          return prev - 1;
        });
      }, 1000);
    }
    return () => clearInterval(interval);
  }, [timerActive, currentTimer]);

  const [newFTag,setNewFTag]=useState('');
  const [sfPool,setSfPool]=useState([]);
  const [sfPicks,setSfPicks]=useState({red:[],blue:[]});
  const [sfTurn,setSfTurn]=useState(0);
    const [sfLineup,setSfLineup]=useState({red:{},blue:{}});
  const [sfPhase,setSfPhase]=useState('spin');

  const TEAM_COLORS = [
    {name: 'Red', hex: '#ff2d55'},
    {name: 'Blue', hex: '#0a84ff'},
    {name: 'Green', hex: '#34c759'},
    {name: 'Purple', hex: '#af52de'},
    {name: 'Orange', hex: '#ff9500'},
    {name: 'Pink', hex: '#ff2d96'},
  ];

  const defaultColors = {red: TEAM_COLORS[0], blue: TEAM_COLORS[1]};
  const [teamColors, setTeamColors] = useState(() => LS.get('vs_team_colors', defaultColors));
  const [teamColorRed, setTeamColorRed] = useState(() => LS.get('vs_team_colors', defaultColors).red);
  const [teamColorBlue, setTeamColorBlue] = useState(() => LS.get('vs_team_colors', defaultColors).blue);
  const [confirmDialog, setConfirmDialog] = useState(null);

  const showConfirm = (message, onConfirm) => setConfirmDialog({message, onConfirm, onCancel: () => setConfirmDialog(null)});

  const getShareText = () => {
    const winnerName = gameOverTeam === 'red' ? names.red : names.blue;
    const loserName = gameOverTeam === 'red' ? names.blue : names.red;
    const modeLabel = activeMode === 'classic' ? 'Classic mode' : activeMode === 'tagteam' ? 'Tag Team' : activeMode === 'masterdebate' ? 'Master Debate' : 'Starting Five';
    const scoreSource = gameOverTeam ? finalScores : scores;
    const scoreText = `${names.red} ${scoreSource.red} - ${scoreSource.blue} ${names.blue}`;
    const roundSummary = roundHistory.length > 0
      ? roundHistory.map((entry, idx) => `${idx+1}. ${entry.summary}`).join('\n')
      : 'No rounds were recorded.';
    return `Vltimate Showdown result: ${winnerName} beat ${loserName} in ${modeLabel}! Final score: ${scoreText}.\n\nRound summary:\n${roundSummary}`;
  };

  const captureResultsScreenshot = async () => {
    if (!resultsRef.current) throw new Error('No results panel available');
    const element = resultsRef.current;
    const rect = element.getBoundingClientRect();
    const styles = Array.from(document.styleSheets).reduce((css, sheet) => {
      try {
        return css + Array.from(sheet.cssRules || []).map(rule => rule.cssText).join('');
      } catch (err) {
        return css;
      }
    }, '');
    const cloned = element.cloneNode(true);
    const serialized = new XMLSerializer().serializeToString(cloned);
    const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${Math.ceil(rect.width)}" height="${Math.ceil(rect.height)}">` +
      `<foreignObject width="100%" height="100%">` +
      `<div xmlns="http://www.w3.org/1999/xhtml" style="width:${rect.width}px;height:${rect.height}px;">` +
      `<style>${styles}</style>${serialized}` +
      `</div></foreignObject></svg>`;
    const svgBlob = new Blob([svg], {type: 'image/svg+xml;charset=utf-8'});
    const url = URL.createObjectURL(svgBlob);
    const img = new Image();
    img.crossOrigin = 'anonymous';
    await new Promise((resolve, reject) => { img.onload = resolve; img.onerror = reject; img.src = url; });
    const scale = window.devicePixelRatio || 2;
    const canvas = document.createElement('canvas');
    canvas.width = rect.width * scale;
    canvas.height = rect.height * scale;
    const ctx = canvas.getContext('2d');
    ctx.scale(scale, scale);
    ctx.drawImage(img, 0, 0);
    URL.revokeObjectURL(url);
    return await new Promise(resolve => canvas.toBlob(resolve, 'image/png'));
  };

  const shareResults = async () => {
    const text = getShareText();
    let screenshotFile = null;
    try {
      const blob = await captureResultsScreenshot();
      if (blob) screenshotFile = new File([blob], 'vltimate-results.png', {type: 'image/png'});
    } catch (err) {
      console.warn('Screenshot capture failed', err);
    }
    try {
      if (navigator.share) {
        const payload = {title: 'Vltimate Showdown Result', text};
        if (screenshotFile) payload.files = [screenshotFile];
        await navigator.share(payload);
        setShareResultMessage('Shared successfully!');
        return;
      }
    } catch (err) {
      console.warn('Native share failed', err);
    }
    try {
      if (screenshotFile && navigator.clipboard && window.ClipboardItem) {
        await navigator.clipboard.write([new ClipboardItem({'image/png': screenshotFile})]);
        setShareResultMessage('Screenshot copied!');
        return;
      }
    } catch (err) {
      console.warn('Clipboard image copy failed', err);
    }
    try {
      if (navigator.clipboard) {
        await navigator.clipboard.writeText(text);
        setShareResultMessage('Copied to clipboard!');
        return;
      }
    } catch (err) {
      // continue to fallback
    }
    try {
      window.prompt('Copy your game result:', text);
      setShareResultMessage('Result ready to share.');
    } catch (err) {
      setShareResultMessage('Could not share automatically.');
    }
  };

  useEffect(() => {
    if (!shareResultMessage) return;
    const timeout = setTimeout(() => setShareResultMessage(''), 3000);
    return () => clearTimeout(timeout);
  }, [shareResultMessage]);

  const getCategoryIcon = (cat) => {
    const icons = {
      items: `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M3 7V5C3 4.44772 3.44772 4 4 4H20C20.5523 4 21 4.44772 21 5V7M3 7V19C3 19.5523 3.44772 20 4 20H20C20.5523 20 21 19.5523 21 19V7M3 7H21M12 11V15M9 13H15" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>`,
      animals: `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M12 2L13.09 8.26L19 9L13.09 9.74L12 16L10.91 9.74L5 9L10.91 8.26L12 2Z" stroke="currentColor" stroke-width="1.5"/><circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.5"/></svg>`,
      popculture: `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><rect x="2" y="4" width="20" height="16" rx="2" stroke="currentColor" stroke-width="1.5"/><circle cx="9" cy="9" r="2" stroke="currentColor" stroke-width="1.5"/><path d="M7 15H11M13 15H17" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>`,
      celebs: `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><circle cx="12" cy="8" r="4" stroke="currentColor" stroke-width="1.5"/><path d="M6 21V19C6 17.8954 6.89543 17 8 17H16C17.1046 17 18 17.8954 18 19V21" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>`,
      memes: `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><rect x="2" y="4" width="20" height="16" rx="2" stroke="currentColor" stroke-width="1.5"/><path d="M8 10H16M8 14H12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><circle cx="18" cy="18" r="1" fill="currentColor"/></svg>`,
      roles: `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><rect x="3" y="6" width="18" height="12" rx="1" stroke="currentColor" stroke-width="1.5"/><path d="M8 10H16M8 14H16" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>`,
      custom: `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M12 2L15 8L22 9L17 14L18 21L12 18L6 21L7 14L2 9L9 8L12 2Z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>`
    };
    return icons[cat] || `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.5"/><path d="M12 8V12M12 16H12.01" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>`;
  };
  const [displayFighter,setDisplayFighter]=useState(null);
  const winTimerRef=useRef(null);
    const [settingsTab,setSettingsTab]=useState('packs');

  useEffect(()=>{
    document.documentElement.setAttribute('data-theme',theme==='default'?'':theme);
  },[theme]);

  useEffect(()=>{setTempRed(names.red);setTempBlue(names.blue);},[]);

  const getPool=()=>{
    let base=[...FIGHTERS.filter(f=>!disabledCats.includes(f.cat)&&!disabledFighters.includes(f.id))];
    enabledPacks.forEach(pid=>{
      const p=EXPANSION_PACKS.find(x=>x.id===pid);
      if(p) p.fighters.forEach(f=>{if(!disabledCats.includes(f.cat)&&!disabledFighters.includes(f.id))base.push(f);});
    });
    if(custom.length>0&&!disabledCats.includes('custom')){
      custom.filter(f=>!disabledFighters.includes(`cx${f.id}`))
        .forEach(f=>base.push({id:`cx${f.id}`,name:f.name,tag:f.tag||'custom fighter',cat:'custom'}));
    }
    return base.length>=10?base:[...FIGHTERS,...custom.map(f=>({id:`cx${f.id}`,name:f.name,tag:f.tag,cat:'custom'}))];
  };

  const getScenarios=()=>{
    let base=[...SCENARIOS];
    enabledPacks.forEach(pid=>{
      const p=EXPANSION_PACKS.find(x=>x.id===pid);

      const lArr = activeMode==='tagteam' ? (team==='red'?matchup.f2:matchup.f1) : [team==='red'?matchup.f2:matchup.f1];
      wArr.forEach(f=>{ if(!ns2[f.id])ns2[f.id]={matches:0,wins:0}; ns2[f.id].matches++; ns2[f.id].wins++; });
      lArr.forEach(f=>{ if(!ns2[f.id])ns2[f.id]={matches:0,wins:0}; ns2[f.id].matches++; });

  const generateTournamentBracket=(size)=>{
    const fighters = pickN(getPool(), size);
    const scenarios = getScenarios();
    const rounds = [];
    let matchId = 1;
    
    // Calculate number of rounds
    const numRounds = Math.ceil(Math.log2(size));
    
    // Generate first round
    const firstRoundMatches = [];
    for (let i = 0; i < size / 2; i++) {
      firstRoundMatches.push({
        id: matchId++,
        fighter1: fighters[i * 2],
        fighter2: fighters[i * 2 + 1],
        winner: null,
        scenario: randItem(scenarios)
      });
    }
    rounds.push({ round: 1, matches: firstRoundMatches });
    
    // Generate subsequent rounds (empty initially)
    for (let r = 2; r <= numRounds; r++) {
      const numMatches = Math.pow(2, numRounds - r);
      const roundMatches = [];
      for (let m = 0; m < numMatches; m++) {
        roundMatches.push({
          id: matchId++,
          fighter1: null,
          fighter2: null,
          winner: null,
          scenario: randItem(scenarios)
        });
      }
      rounds.push({ round: r, matches: roundMatches });
    }
    
    return rounds;
  };

                ))}
              </div>
              <div style={{fontSize:12,color:'var(--muted)'}}>End classic and tag-team games when a team reaches this score.</div>
            </div>
            <div style={{background:'var(--surf)',border:'1px solid var(--border)',borderRadius:16,padding:18,display:'flex',flexDirection:'column',gap:14}}>
              <div style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
                <div style={{fontSize:14,color:'var(--muted)',fontWeight:700}}>TOURNAMENT SIZE</div>
                <div style={{fontSize:12,color:'var(--text)'}}>{tournamentSize} fighters</div>
              </div>
              <div style={{display:'flex',flexWrap:'wrap',gap:10}}>
                {[4,8,16].map(val=>(
                  <button key={val} className={`btn btn-sm ${tournamentSize===val?'btn-g':'btn-ghost'}`} onClick={()=>setTournamentSizeAndSave(val)} style={{minWidth:86}}>
                    {val}
                  </button>
                ))}
              </div>
              <div style={{fontSize:12,color:'var(--muted)'}}>Adjust the bracket size for tournament mode.</div>
            </div>
          </div>
        )}

        {settingsTab==='roster'&&(
          <div style={{padding:'0 20px 32px',display:'flex',flexDirection:'column',gap:18}} className="a2">
            <div style={{display:'flex',flexDirection:'column',gap:8}}>
              <div style={{fontSize:13,color:'var(--muted)'}}>Toggle categories or individual fighters. Custom fighters are now managed here too.</div>
              <button className="btn btn-sm btn-outline-b" onClick={resetRosterFilters} style={{width:'fit-content'}}>Reset roster filters</button>
            </div>
            {Object.entries(grouped).map(([cat,fList],idx)=>{
              const isCatOff=disabledCats.includes(cat);
              return(
                <div key={cat} style={{animationDelay:`${idx*.05}s`}}>
                  <div className="cat-header">
                    <div className="cat-title">{cat} ({fList.length})</div>
                    <label className="tog"><input type="checkbox" checked={!isCatOff} onChange={()=>toggleCat(cat)}/><div className="tog-tr"/></label>
                  </div>
                  {!isCatOff&&(
                    <div style={{padding:'12px 0',display:'flex',flexWrap:'wrap',gap:8}}>
                      {fList.map(f=>{const isOff=disabledFighters.includes(f.id);return<div key={f.id} className={`dir-chip ${isOff?'off':''}`} onClick={()=>toggleFighter(f.id)}>{f.name}</div>;})}
                    </div>
                  )}
                </div>
              );
            })}
            <div style={{background:'var(--surf)',border:'1px solid var(--border)',borderRadius:16,padding:16,display:'flex',flexDirection:'column',gap:10}}>
              <div style={{fontFamily:'var(--D)',fontSize:14,letterSpacing:3,color:'var(--muted)'}}>CUSTOM FIGHTERS</div>
              <div style={{display:'flex',flexDirection:'column',gap:10}}>
                <input className="inp" value={newFName} onChange={e=>setNewFName(e.target.value)} placeholder="Fighter name..." maxLength={40} onKeyDown={e=>e.key==='Enter'&&newFName.trim()&&addCustom()}/>
                <input className="inp" value={newFTag} onChange={e=>setNewFTag(e.target.value)} placeholder='Tagline (optional)' maxLength={60} onKeyDown={e=>e.key==='Enter'&&newFName.trim()&&addCustom()}/>
                <button className="btn btn-g btn-sm" onClick={addCustom} disabled={!newFName.trim()} style={{opacity:newFName.trim()?1:.5,width:'fit-content'}}>+ ADD FIGHTER</button>
              </div>
              {custom.length===0?(
                <div style={{fontSize:13,color:'var(--muted)'}}>No custom fighters yet. Add your own to the roster.</div>
              ):(
                <div style={{display:'flex',flexDirection:'column',gap:8}}>
                  {custom.map((f,i)=>(
                    <div key={f.id} className="f-list-item" style={{padding:'10px 12px'}}>
                      <div className="f-list-info"><div className="f-list-name">{f.name}</div><div className="f-list-tag">{f.tag}</div></div>
                      <button className="del-btn" onClick={()=>delCustom(f.id)}>✕</button>
                    </div>
                  ))}
                </div>
              )}
            </div>
          </div>
        )}
      </div>
    );
  }

  /* ── LEADERBOARD ── */
  if(screen==='leaderboard'){
    const ranked=getPool().map(f=>{
      const rid=String(f.id).replace('cx','');
      const st=fighterStats[rid]||{matches:0,wins:0};
      return{...f,...st,winPct:st.matches>0?Math.round((st.wins/st.matches)*100):0};
    }).filter(f=>f.matches>0).sort((a,b)=>b.winPct-a.winPct||b.wins-a.wins);
    return(
      <div className="shell scroll">
        <button className="nav-back" onClick={()=>setScreen('home')}>← BACK</button>
        <div style={{padding:'0 20px 32px'}}>
          <div className="a0"><div style={{fontFamily:'var(--D)',fontSize:38,letterSpacing:2}}>HALL OF FAME</div><div style={{fontSize:13,color:'var(--muted)',marginTop:4,marginBottom:20}}>All-time win rates for your roster.</div></div>
          <div style={{display:'flex',justifyContent:'center',marginBottom:20}}>
            <button className="btn btn-ghost" onClick={() => showConfirm('Clear all fighter stats? This cannot be undone.', clearLeaderboard)}>CLEAR LEADERBOARD</button>
          </div>
          <div className="a1" style={{display:'flex',flexDirection:'column',gap:8}}>
            {ranked.map((f,i)=>(
              <div key={f.id} className="f-list-item" style={{animationDelay:`${i*.04}s`}}>
                <div style={{fontFamily:'var(--D)',fontSize:20,color:i===0?'var(--gold)':'var(--muted)',width:28}}>#{i+1}</div>
                <div className="f-list-info"><div className="f-list-name">{f.name}</div><div className="f-list-tag">{f.wins}W - {f.matches-f.wins}L</div></div>
                <div style={{fontFamily:'var(--D)',fontSize:24,color:f.winPct>50?'var(--gold)':'var(--text)'}}>{f.winPct}%</div>
              </div>
            ))}
            {ranked.length===0&&<div className="empty-state"><div className="empty-icon">📊</div><div className="empty-text">No battles yet.<br/>Play some rounds to see who rises.</div></div>}
          </div>
        </div>
        {confirmDialog && (
          <div className="confirm-overlay" onClick={() => setConfirmDialog(null)}>
            <div className="confirm-modal" onClick={e => e.stopPropagation()}>
              <div className="confirm-message">{confirmDialog.message}</div>
              <div className="confirm-buttons">
                <button onClick={confirmDialog.onCancel}>Cancel</button>
                <button onClick={() => {confirmDialog.onConfirm(); setConfirmDialog(null);}}>Confirm</button>
              </div>
            </div>
          </div>
        )}
      </div>
    );
  }

  /* ── HOW TO PLAY ── */
  if(screen==='howToPlay') return(
    <div className="shell scroll">
      <button className="nav-back" onClick={()=>setScreen('home')}>← BACK</button>
      <div style={{padding:'0 20px 40px',display:'flex',flexDirection:'column',gap:24}}>
        <div className="a0"><div style={{fontFamily:'var(--D)',fontSize:38,letterSpacing:2}}>HOW TO PLAY</div><div style={{fontSize:13,color:'var(--muted)',marginTop:4}}>The ultimate test of logic, volume, and unearned confidence.</div></div>
        <div className="a1" style={{background:'var(--surf)',border:'1px solid var(--border)',borderRadius:16,padding:16}}>
          <div style={{fontFamily:'var(--D)',fontSize:20,color:'var(--gold)',letterSpacing:1,marginBottom:12}}>PHASE 1: THE DRAFT (PHYSICAL)</div>
          <div style={{fontSize:14,lineHeight:1.5,display:'flex',flexDirection:'column',gap:10}}>
            <p>Don't want to choose teams? Let the deck decide.</p>
            <ul style={{paddingLeft:20,color:'var(--muted)',display:'flex',flexDirection:'column',gap:6}}>
              <li>Grab a physical deck of playing cards.</li>
              <li>Pull out enough cards so there is one for every human playing.</li>
              <li>Shuffle and deal one face-down to everyone. Flip 'em.</li>
              <li><strong>Red suits = Red Team. Black suits = Blue Team.</strong></li>
            </ul>
          </div>
        </div>
        <div className="a2" style={{background:'var(--surf)',border:'1px solid var(--border)',borderRadius:16,padding:16}}>
          <div style={{fontFamily:'var(--D)',fontSize:20,color:'var(--gold)',letterSpacing:1,marginBottom:12}}>PHASE 2: THE DEBATE</div>
          <div style={{fontSize:14,lineHeight:1.5,display:'flex',flexDirection:'column',gap:10}}>
            <p>Once teams are set, start the game on the app.</p>
            <ul style={{paddingLeft:20,color:'var(--muted)',display:'flex',flexDirection:'column',gap:6}}>
              <li>Read the matchup and scenario aloud.</li>
              <li>Each team has <strong>60 seconds</strong> to argue why their fighter dominates.</li>
              <li>Cross-examination is allowed. Yelling is encouraged.</li>
              <li>The team that made the best (or funniest) argument gets the point.</li>
            </ul>
          </div>
        </div>
        <div className="a3" style={{background:'var(--surf2)',border:'1px dashed var(--border2)',borderRadius:16,padding:16}}>
          <div style={{fontFamily:'var(--D)',fontSize:20,letterSpacing:1,marginBottom:12}}>HOUSE RULES</div>
          <div style={{fontSize:14,lineHeight:1.5,display:'flex',flexDirection:'column',gap:16}}>
            <div><strong style={{color:'var(--red)'}}>The Devil's Advocate:</strong><p style={{color:'var(--muted)',marginTop:4}}>Both teams instantly swap sides and argue for the other fighter.</p></div>
            <div><strong style={{color:'var(--blue)'}}>The Blind Draw:</strong><p style={{color:'var(--muted)',marginTop:4}}>Champions must start arguing before they even know who they drew.</p></div>
            <div><strong style={{color:'var(--gold)'}}>The High Roller:</strong><p style={{color:'var(--muted)',marginTop:4}}>The losing team buys the next round of drinks. Or does the dishes. Your call.</p></div>
          </div>
        </div>
      </div>
    </div>
  );

  /* ── MY FIGHTERS ── */

    /* ── STARTING FIVE — ROULETTE DRAFT & ASSIGN ── */
  if(screen==='sf_draft'){
    const team = sfTurn % 2 === 0 ? 'red' : 'blue';
    const teamLineup = sfLineup[team] || {};
    const availablePos = POSITIONS.filter(p => !teamLineup[p]);

    const startSpin = () => {
      setSfPhase('spinning');
      let ticks = 0;
      const maxTicks = 20; // How long the wheel spins
      const spinInterval = setInterval(() => {
        // Flash random fighters from the pool to simulate a slot machine
        setDisplayFighter(randItem(sfPool));
        ticks++;
        if(ticks >= maxTicks) {
          clearInterval(spinInterval);
          // Lock in the actual randomly assigned fighter for this turn
          setDisplayFighter(sfPool[sfTurn]); 
          setSfPhase('assign');
        }
      }, 60);
    };

    const handleAssign = (pos) => {
      const nextLineup = { ...sfLineup, [team]: { ...teamLineup, [pos]: sfPool[sfTurn] } };
      setSfLineup(nextLineup);
      
      if (sfTurn + 1 >= 10) {
        setScreen('sf_debate');
      } else {
        // Reset for the next team's spin
        setSfTurn(sfTurn + 1);
        setSfPhase('spin');
        setDisplayFighter(null);
      }
    };

    return (
      <div className="shell scroll">
        <button className="nav-back" onClick={() => showConfirm('Back out of the draft? Progress will be lost.', () => {resetSfState(); setScreen('home');})}>← HOME</button>
        <div className="score-bar">
          <div className="score-side" style={{color: teamColors.red.hex}}>
            <div className="score-n r" style={{color: teamColors.red.hex}}>{Object.keys(sfLineup.red||{}).length}</div>
            <div className="score-lbl">{names.red}</div>
          </div>
          <div className="score-mid">
            <div style={{fontFamily:'var(--D)',fontSize:13,letterSpacing:3,color:'var(--muted)'}}>DRAFT</div>
            <div style={{fontSize:11,color:'var(--muted)',fontWeight:700}}>{10-sfTurn} LEFT</div>
          </div>
          <div className="score-side" style={{color: teamColors.blue.hex}}>
            <div className="score-n b" style={{color: teamColors.blue.hex}}>{Object.keys(sfLineup.blue||{}).length}</div>
            <div className="score-lbl">{names.blue}</div>
          </div>
        </div>

        <div className="turn-banner" style={{color: team === 'red' ? teamColors.red.hex : teamColors.blue.hex}}>
          {team==='red'?names.red:names.blue}'S TURN
        </div>

        <div style={{padding:'20px 20px', textAlign:'center', display:'flex', flexDirection:'column', gap: 20}}>
          
          {/* THE SPIN BUTTON */}
          {sfPhase === 'spin' && (
            <div className="a1" style={{marginTop: 40}}>
              <button className="btn" style={{background: team === 'red' ? teamColors.red.hex : teamColors.blue.hex, boxShadow: `0 8px 32px ${team === 'red' ? teamColors.red.hex + '40' : teamColors.blue.hex + '40'}`}} onClick={startSpin}>
                DRAW COMPETITOR
              </button>
            </div>
          )}

          {/* THE ROULETTE WINDOW */}
          {(sfPhase === 'spinning' || sfPhase === 'assign') && displayFighter && (
            <div className="a0" style={{background:'var(--surf)', border:`2px solid var(--${sfPhase === 'assign' ? team : 'border'})`, borderRadius:16, padding:'30px 16px', boxShadow: sfPhase === 'assign' ? `0 0 40px var(--${team}-d)` : 'none', transition: 'all 0.1s'}}>
              <div style={{fontFamily:'var(--D)', fontSize: sfPhase==='spinning'?28:36, lineHeight:1, color: sfPhase==='spinning'?'var(--muted)':'var(--text)'}}>
                {displayFighter.name}
              </div>
              <div style={{fontSize:13, color:'var(--muted)', fontStyle:'italic', marginTop:8, opacity: sfPhase==='spinning'?0:1, transition: 'opacity 0.2s'}}>
                "{displayFighter.tag}"
              </div>
            </div>
          )}

          {/* THE POSITION ASSIGNMENT */}
          {sfPhase === 'assign' && (
            <div className="a2" style={{marginTop: 10}}>
              <div style={{fontSize:12, color:'var(--muted)', fontWeight:800, letterSpacing:1, marginBottom: 12}}>
                ASSIGN TO POSITION:
              </div>
              <div className="pos-rows">
                {availablePos.map(pos=>(
                  <div key={pos} className="pos-row" onClick={() => handleAssign(pos)} style={{cursor: 'pointer', border: `1px solid var(--${team}-d)`}}>
                    <div className={`pos-lbl ${team}`}>{pos}</div>
                    <div style={{fontSize:14, color:'var(--text)', fontWeight:700, flex: 1, textAlign: 'left'}}>{POS_FULL[pos]}</div>
                    <div style={{color: `var(--${team})`, fontSize: 20}}>+</div>
                  </div>
                ))}
              </div>
            </div>
          )}
        </div>
        {confirmDialog && (
          <div className="confirm-overlay" onClick={() => setConfirmDialog(null)}>
            <div className="confirm-modal" onClick={e => e.stopPropagation()}>
              <div className="confirm-message">{confirmDialog.message}</div>
              <div className="confirm-buttons">
                <button onClick={confirmDialog.onCancel}>Cancel</button>
                <button onClick={() => {confirmDialog.onConfirm(); setConfirmDialog(null);}}>Confirm</button>
              </div>
            </div>
          </div>
        )}
      </div>
    );
  }



  /* ── TOURNAMENT ── */
  if(screen==='tournament'){
    const currentRound = tournamentBracket[tournamentRound - 1];
    const roundNames = ['Quarterfinals', 'Semifinals', 'Championship'];
    const isFinalRound = tournamentRound === 3;

    return (
      <div className="shell scroll">
        <button className="nav-back" onClick={() => showConfirm('End tournament?', () => setScreen('home'))}>← HOME</button>
        <div style={{padding:'0 20px 10px'}}>
          <div style={{textAlign:'center',marginBottom:20}}>
            <div style={{fontFamily:'var(--D)',fontSize:18,letterSpacing:2,color:'var(--gold)',marginBottom:4}}>TOURNAMENT</div>
            <div style={{fontSize:16,color:'var(--text)',fontWeight:600,marginBottom:8}}>{roundNames[tournamentRound - 1]}</div>
            <div style={{fontSize:14,color:'var(--muted)',marginBottom:12}}>Round {tournamentRound} of 3</div>
            {currentRound && (
              <div style={{fontSize:12,color:'var(--gold)',fontWeight:600}}>
                {currentRound.matches.filter(m => !m.winner).length} match{currentRound.matches.filter(m => !m.winner).length !== 1 ? 'es' : ''} remaining
              </div>
            )}
          </div>

          <div className="tournament-bracket">
            {currentRound && currentRound.matches.map(match => (
              <div key={match.id} className="tournament-match">
                <div style={{width:'100%',textAlign:'center',marginBottom:16,padding:'12px',background:'rgba(255,214,10,0.1)',borderRadius:'12px',border:'1px solid rgba(255,214,10,0.3)'}}>
                  <div style={{fontSize:14,color:'var(--gold)',fontWeight:600,marginBottom:6}}>🏆 BATTLE SCENARIO 🏆</div>
                  <div style={{fontSize:16,color:'var(--text)',fontStyle:'italic',lineHeight:1.4,fontWeight:500}}>"{match.scenario}"</div>
                </div>
                <div style={{display:'flex',alignItems:'center',width:'100%',justifyContent:'space-between'}}>
                  <div className="fighter-option" onClick={() => !match.winner && selectTournamentWinner(match.id, match.fighter1)}>
                    <div className="fighter-name">{match.fighter1?.name || 'TBD'}</div>
                    {match.fighter1?.tag && <div style={{fontSize:12,color:'var(--muted)',marginTop:2,textAlign:'center'}}>"{match.fighter1.tag}"</div>}
                    {match.winner?.id === match.fighter1?.id && <div className="winner-badge">🏆</div>}
                  </div>
                  <div style={{fontSize:32,margin:'0 16px',color:'var(--gold)',fontWeight:800,textShadow:'2px 2px 4px rgba(0,0,0,0.3)'}}>⚔️</div>
                  <div className="fighter-option" onClick={() => !match.winner && selectTournamentWinner(match.id, match.fighter2)}>
                    <div className="fighter-name">{match.fighter2?.name || 'TBD'}</div>
                    {match.fighter2?.tag && <div style={{fontSize:12,color:'var(--muted)',marginTop:2,textAlign:'center'}}>"{match.fighter2.tag}"</div>}
                    {match.winner?.id === match.fighter2?.id && <div className="winner-badge">🏆</div>}
                  </div>
                </div>
              </div>
            ))}
          </div>

          {tournamentWinner && (
            <div className="winner-announcement">
              <div style={{fontSize:20,fontWeight:800,color:'var(--gold)'}}>🏆 CHAMPION 🏆</div>
              <div style={{fontSize:18,marginTop:10}}>{tournamentWinner.name}</div>
              <div style={{fontSize:14,color:'var(--muted)',fontStyle:'italic',marginTop:4}}>"{tournamentWinner.tag}"</div>
              <button className="btn btn-gold" style={{marginTop:20}} onClick={() => setScreen('home')}>BACK TO HOME</button>
            </div>
          )}
        </div>
        {confirmDialog && (
          <div className="confirm-overlay" onClick={() => setConfirmDialog(null)}>
            <div className="confirm-modal" onClick={e => e.stopPropagation()}>
              <div className="confirm-message">{confirmDialog.message}</div>
              <div className="confirm-buttons">
                <button onClick={confirmDialog.onCancel}>Cancel</button>
                <button onClick={() => {confirmDialog.onConfirm(); setConfirmDialog(null);}}>Confirm</button>
              </div>
            </div>
          </div>
        )}
      </div>
    );
  }



  /* ── SF DEBATE ── */
  if(screen==='sf_debate') return(
    <div className="shell scroll">
      <button className="nav-back" onClick={()=>setScreen('home')}>← HOME</button>
      <div style={{padding:'0 20px 10px'}}>
        <div style={{fontFamily:'var(--D)',fontSize:34,letterSpacing:2}} className="a0">THE LINEUPS</div>
        <div style={{fontSize:13,color:'var(--gold)',fontWeight:800,marginTop:4}} className="a1">Who has the better starting five? DEBATE!</div>
      </div>
      <div className="lineup-wrap a2" style={{paddingBottom:4}}>
        {['red','blue'].map(team=>(
          <div key={team} className="lineup-side">
            <div className="lineup-hd" style={{color: team === 'red' ? teamColors.red.hex : teamColors.blue.hex}}>{team==='red'?names.red:names.blue}</div>
            {POSITIONS.map(pos=>(
              <div key={pos} className="lineup-item">
                <div className="lineup-pos-lbl">{pos} · {POS_FULL[pos]}</div>
                <div className="lineup-fname">{sfLineup[team][pos]?.name||'—'}</div>
              </div>
            ))}
          </div>
        ))}
      </div>
      <div style={{padding:'12px 20px'}}>
        <div style={{fontSize:12,color:'var(--muted)',fontWeight:800,letterSpacing:.5,textAlign:'center',marginBottom:12}}>WHICH TEAM WINS? VOTE BELOW</div>
        <div style={{display:'flex',gap:8,marginBottom:8}}>
          <button className="btn-outline-r" style={{borderColor: teamColors.red.hex + '4D', color: teamColors.red.hex}} onClick={()=>award('red')}>{names.red}</button>
          <button className="btn-outline-b" style={{borderColor: teamColors.blue.hex + '4D', color: teamColors.blue.hex}} onClick={()=>award('blue')}>{names.blue}</button>
        </div>
        <button className="btn btn-ghost" onClick={()=>{setPendingMode('sf');setTempRed(names.red);setTempBlue(names.blue);setScreen('setup');}}>⟳ NEW DRAFT</button>
      </div>
      {showWin&&(
        <div className={`win-overlay ${winTeam}`} onClick={()=>setShowWin(false)}>
          <div className="win-big" style={{color: winTeam === 'red' ? teamColors.red.hex : teamColors.blue.hex, textShadow: `0 0 60px ${winTeam === 'red' ? teamColors.red.hex + '66' : teamColors.blue.hex + '66'}`}}>{winTeam==='red'?names.red:names.blue}</div>
          <div className="win-sub">HAS THE BETTER TEAM!</div>
          <div className="win-dismiss">TAP TO CONTINUE</div>
        </div>
      )}
    </div>
  );

  return<div className="shell" style={{alignItems:'center',justifyContent:'center'}}>
    <div style={{fontFamily:'var(--D)',fontSize:24,letterSpacing:4,color:'var(--muted)'}}>LOADING...</div>
  </div>;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
